name: 🌧️ Chuva Tempo Real (a cada 5 min)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chuva-tempo-real
  cancel-in-progress: false

jobs:
  coleta_incremental:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy requests pytz

      - name: Executar atualização da chuva
        env:
          CEMADEN_EMAIL: ${{ secrets.CEMADEN_EMAIL }}
          CEMADEN_PASS: ${{ secrets.CEMADEN_PASS }}
        run: |
          python atualizar_dados.py

      - name: Conferir as últimas linhas do CSV
        run: |
          echo "Quantidade de linhas:"
          wc -l chuva_tempo_real.csv || true
          echo ""
          echo "Últimas 20 linhas:"
          tail -n 20 chuva_tempo_real.csv || true

      - name: Commit e push do CSV atualizado
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add chuva_tempo_real.csv

          git diff --cached --quiet && echo "Nenhuma alteração para enviar." && exit 0

          git commit -m "Atualiza chuva em tempo real [skip ci]"
          git push