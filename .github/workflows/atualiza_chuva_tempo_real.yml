name: 🌧️ Chuva Tempo Real (a cada 5 min)

on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:

jobs:
  coleta_incremental:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        
      - name: Configurar Ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Instalar Dependências
        run: python -m pip install requests pandas pytz tomli

      - name: Rodar script de atualização em tempo real
        env:
          CEMADEN_EMAIL: ${{ secrets.CEMADEN_EMAIL }}
          CEMADEN_PASS: ${{ secrets.CEMADEN_PASS }}
        run: python atualizar_dados.py

      - name: Fazer commit e push do arquivo rotativo
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add chuva_tempo_real.csv
          git commit -m "Atualizando chuva_tempo_real.csv [skip ci]" || exit 0
          git push