name: 🌧️ Chuva Incremental (a cada 5 min)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  pipeline_chuva_incremental:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pandas pytz

      - name: Executar coleta incremental
        env:
          CEMADEN_EMAIL: ${{ secrets.CEMADEN_EMAIL }}
          CEMADEN_PASS: ${{ secrets.CEMADEN_PASS }}
        run: python atualizar_dados.py

      - name: Verificar arquivos incrementais
        run: |
          echo "=== Arquivos de chuva disponíveis ==="
          ls -lah chuva_recife_*.csv || true

          echo ""
          echo "=== Últimas 20 linhas do arquivo de hoje ==="
          ARQUIVO_HOJE="chuva_recife_$(TZ=America/Recife date +%F).csv"
          echo "Arquivo: ${ARQUIVO_HOJE}"
          tail -n 20 "${ARQUIVO_HOJE}" || true

      - name: Commit e push dos CSVs incrementais
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add chuva_recife_*.csv

          if git diff --cached --quiet; then
            echo "Nenhuma atualização de chuva para enviar."
            exit 0
          fi

          git commit -m "Atualiza chuva incremental [skip ci]"
          git pull --rebase origin main
          git push origin main