name: 📊 Consolidação Diária do Histórico de Risco

on:
  schedule:
    # 03:15 UTC = aproximadamente 00:15 em Recife (UTC-3)
    - cron: "37 3 * * *"
  workflow_dispatch:

jobs:
  pipeline_risco_diario:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy requests pytz streamlit openmeteo-requests requests-cache retry-requests

      - name: Calcular risco de dias encerrados
        run: python calcular_risco_diario.py

      - name: Conferir histórico gerado
        run: |
          echo "=== Últimas 20 linhas do histórico ==="
          tail -n 20 historico_risco-final.csv || true

      - name: Commit e push do histórico
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add historico_risco-final.csv

          if git diff --cached --quiet; then
            echo "Nenhuma alteração no histórico para enviar."
            exit 0
          fi

          git commit -m "Consolida histórico de risco D+1 [skip ci]"
          git push